name: Lam Loop Notify
# Surfaces Lam Loop state transitions to Telegram. GitHub/Linear remain the source
# of truth — Telegram is a notification surface. Requires repo secrets
# TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID. No-ops quietly if unset.
on:
  pull_request:
    types: [labeled]
  issues:
    types: [labeled]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify on a Lam Loop transition
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          LABEL: ${{ github.event.label.name }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
        run: |
          [ -z "$TOKEN" ] || [ -z "$CHAT" ] && { echo "Telegram secrets unset — skipping"; exit 0; }
          case "$LABEL" in
            loop-approved)      msg="✅ Merge-ready — reviewer approved, CI green. You merge.%0A$PR_TITLE%0A$PR_URL ($REPO)";;
            needs-human-review) msg="⚠️ Escalated — needs your judgment.%0A$PR_TITLE%0A$PR_URL ($REPO)";;
            blocked)            msg="⛔ Blocked — awaiting your answer.%0A$ISSUE_TITLE%0A$ISSUE_URL ($REPO)";;
            *) echo "not a Lam Loop transition — skip"; exit 0;;
          esac
          curl -s "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" --data-urlencode "text=$msg" -d "disable_web_page_preview=true" >/dev/null \
            && echo "notified Telegram: $LABEL"
